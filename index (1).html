<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kad Nafas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--w1:#c98f55;--w2:#9a6636;--w3:#b97d46;--bar:#7a4a25;--ink:#3b2a20;--cream:#fbf1d9;--panel:#fff8e8;--ptx:#3b2a20;--bk:#2f7d6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--w1:#7d5430;--w2:#5a3a1c;--w3:#6f4724;--bar:#3e2812;--panel:#2b2016;--ptx:#f3e6c9}}
:root[data-theme="dark"]{--w1:#7d5430;--w2:#5a3a1c;--w3:#6f4724;--bar:#3e2812;--panel:#2b2016;--ptx:#f3e6c9}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:repeating-linear-gradient(90deg,var(--w1) 0 78px,var(--w2) 78px 80px,var(--w3) 80px 160px,var(--w2) 160px 162px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:600px;margin:0 auto;padding:10px}
.bar{display:flex;gap:8px;align-items:center;background:var(--bar);border-radius:16px;padding:8px 10px;color:#fff3d6;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bar b{font-size:1.1rem;flex:1}
.pill{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.25);border-radius:99px;padding:4px 12px;font-weight:600}
.pill svg,.gear svg{width:20px;height:20px;fill:none;stroke:#fff3d6;stroke-width:2.2;stroke-linecap:round}
.gear{background:rgba(0,0,0,.25);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
#orgs{display:flex;gap:8px;justify-content:center;margin:14px 0 6px;min-height:104px}
.og{flex:1;max-width:130px;background:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:4px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:opacity .3s,transform .3s}
.og svg{width:54px;height:54px}.og span{display:block;font-weight:600;font-size:.8rem}.og small{font-size:.68rem}
.og.act{transform:translateY(-4px);outline:4px solid #ffe08a}
.og.gone{opacity:0;pointer-events:none;transform:scale(.7)}
#msg{margin:8px 0;background:rgba(0,0,0,.35);color:#fff3d6;border-radius:12px;padding:8px 12px;font-size:.88rem;min-height:40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.cd{aspect-ratio:3/4;perspective:500px}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.op .in{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.bk{background:radial-gradient(circle at 50% 50%,#4aa58f 0 18%,transparent 19%),repeating-radial-gradient(circle at 50% 50%,var(--bk) 0 6px,#276a5a 6px 8px)}
.fr{background:var(--cream);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;overflow:hidden}
.fr svg,.fr img{width:100%;flex:1;min-height:0;object-fit:contain}
.fr i{font-style:normal;font-size:.6rem;font-weight:600;line-height:1.1;text-align:center}
.dn .fr{background:#e6efc9;border-color:#4d7c2a}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(90vw,360px);background:var(--panel);color:var(--ptx);border-right:4px solid var(--ink);transform:translateX(-104%);transition:transform .2s;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.drawer.open{transform:none}
.drawer h3{margin:12px 0 6px}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.9rem}
.row svg,.row img{width:34px;height:34px;object-fit:contain;background:#fbf1d9;border-radius:6px}
.row span{flex:1}.row small{opacity:.7}
.btn{background:var(--ink);color:#fff3d6;border-radius:10px;padding:8px 14px;font-weight:600}
.btn.alt{background:transparent;color:var(--ptx);border:2px solid currentColor}
.drawer input,.drawer select{font:inherit;width:100%;padding:6px;margin-bottom:6px;border:2px solid var(--ink);border-radius:8px;background:#fffdf5;color:#3b2a20}
.modal{position:fixed;inset:0;background:rgba(20,10,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.open{display:flex}
.box{background:var(--panel);color:var(--ptx);border-radius:18px;padding:16px;max-width:440px;width:100%;max-height:88vh;overflow:auto}
.box ul{padding-left:18px;font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="drawer" id="dr"></div>
<div class="wrap">
 <div class="bar"><b>Kad Nafas</b><span class="pill"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="11" height="15" rx="2"/><path d="M9 21h10a2 2 0 0 0 2-2V8"/></svg><span id="cn">0/0</span></span><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span id="tm">0:00</span></span><button class="gear" id="gb" aria-label="Pilih haiwan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button></div>
 <div id="orgs"></div>
 <div id="msg"></div>
 <div id="grid"></div>
</div>
<div class="modal" id="md"><div class="box" id="bx"></div></div>
<script>
const $=i=>document.getElementById(i);
const G=b=>'<svg viewBox="0 0 64 64"><g stroke="#3b2a20" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">'+b+'</g></svg>';
const ey=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="3.6" fill="#fff"/><circle cx="'+x+'" cy="'+y+'" r="1.7" fill="#222" stroke="none"/>';
const ORG={
p:{n:"Peparu",v:G('<path d="M30 8v24M30 32q-4-5-12 1-8 8-8 20 2 6 10 4 8-2 10-10zM34 32q4-5 12 1 8 8 8 20-2 6-10 4-8-2-10-10z" fill="#ef7f9a"/>')},
i:{n:"Insang",v:G('<path d="M18 12q-9 20 0 40M30 12q-9 20 0 40M42 12q-9 20 0 40" stroke="#e5533d" stroke-width="6" fill="none"/>')},
k:{n:"Kulit lembap",v:G('<path d="M32 6q18 22 18 36a18 18 0 0 1-36 0q0-14 18-36z" fill="#58b4e8"/><path d="M24 44q2 6 8 7" fill="none" stroke="#fff"/>')},
s:{n:"Spirakel",v:G('<rect x="5" y="18" width="54" height="28" rx="14" fill="#e0a21a"/><circle cx="20" cy="32" r="4" fill="#3b2a20"/><circle cx="32" cy="32" r="4" fill="#3b2a20"/><circle cx="44" cy="32" r="4" fill="#3b2a20"/>')}};
const D=[
["ketam","Ketam","i","Ketam bernafas dengan insang.",G('<path d="M12 28l-6-10M52 28l6-10M14 40l-8 6M50 40l8 6M18 46l-4 10M46 46l4 10" fill="none"/><circle cx="9" cy="17" r="7" fill="#e5533d"/><circle cx="55" cy="17" r="7" fill="#e5533d"/><ellipse cx="32" cy="38" rx="20" ry="14" fill="#e5533d"/>'+ey(25,32)+ey(39,32)+'<path d="M27 43q5 4 10 0" fill="none"/>')],
["beluncas","Beluncas","s","Beluncas bernafas melalui spirakel di tepi badannya.",G('<path d="M12 46v6M24 46v6M36 46v6M48 46v6" fill="none"/><circle cx="12" cy="38" r="8" fill="#8bc34a"/><circle cx="24" cy="38" r="8" fill="#8bc34a"/><circle cx="36" cy="38" r="8" fill="#8bc34a"/><circle cx="48" cy="38" r="8" fill="#8bc34a"/><circle cx="53" cy="32" r="9" fill="#a5d65f"/>'+ey(55,30)+'<path d="M52 12l3 10" fill="none"/>')],
["berudu","Berudu","i","Berudu bernafas dalam air menggunakan insang.",G('<path d="M30 32l28-12v24z" fill="#6b8e4e"/><ellipse cx="22" cy="32" rx="16" ry="13" fill="#4f6f3a"/>'+ey(16,28)+'<path d="M12 38q5 3 9 0" fill="none"/>')],
["cacing","Cacing","k","Cacing bernafas melalui kulitnya yang lembap.",G('<path d="M8 46q8-22 18-4t18-4q8-12 14 0" fill="none" stroke-width="14"/><path d="M8 46q8-22 18-4t18-4q8-12 14 0" fill="none" stroke="#f0a0b3" stroke-width="10"/>'+ey(55,38))],
["lintah","Lintah","k","Lintah menyerap oksigen melalui kulit yang lembap.",G('<path d="M6 42q12-18 26-8t22-4q6 8-2 14t-24 6q-16 4-22-8z" fill="#6a4a3c"/>'+ey(50,38))],
["kucing","Kucing","p","Kucing ialah mamalia dan bernafas dengan peparu.",G('<path d="M12 28l2-18 14 10zM52 28l-2-18-14 10z" fill="#f29b3a"/><circle cx="32" cy="36" r="20" fill="#f29b3a"/><path d="M32 17v7M24 18l2 6M40 18l-2 6M6 40l14 2M6 48l14-4M58 40l-14 2M58 48l-14-4" fill="none"/>'+ey(24,34)+ey(40,34)+'<path d="M29 41h6l-3 3z" fill="#e57a8a"/>')],
["kupu","Kupu-kupu","s","Kupu-kupu bernafas melalui spirakel di badannya.",G('<path d="M32 30L8 10q-6 14 4 22 6 4 20-2zM32 30L56 10q6 14-4 22-6 4-20-2z" fill="#f08a24"/><path d="M32 34L14 56q10 6 18-8zM32 34l18 22q-10 6-18-8z" fill="#f6b73c"/><ellipse cx="32" cy="34" rx="3.5" ry="14" fill="#3b2a20"/><path d="M31 21l-5-9M33 21l5-9" fill="none"/>')],
["buaya","Buaya","p","Buaya ialah reptilia dan bernafas dengan peparu walaupun hidup di air.",G('<path d="M2 40q6-4 10-12 6-6 22-2l26 8v8q-20 8-34 4Q10 48 2 40z" fill="#5fa84a"/><path d="M40 38l3 4 3-4 3 4 3-4 3 4" fill="none"/>'+ey(24,30))],
["belalang","Belalang","s","Belalang bernafas melalui spirakel di sepanjang badannya.",G('<path d="M18 40L8 22 3 44M32 46l-2 10M40 46l6 10M56 24l6-10" fill="none"/><ellipse cx="30" cy="38" rx="20" ry="9" fill="#7cb342"/><circle cx="52" cy="32" r="9" fill="#8bc34a"/>'+ey(54,30))],
["semut","Semut","s","Semut mengambil udara melalui spirakel.",G('<path d="M26 44l-6 12M32 44v12M38 44l6 12M52 27l6-10M46 26l-2-10" fill="none"/><circle cx="14" cy="38" r="9" fill="#8a4b2a"/><circle cx="30" cy="38" r="6" fill="#8a4b2a"/><circle cx="46" cy="34" r="9" fill="#8a4b2a"/>'+ey(48,32))],
["lebah","Lebah","s","Lebah bernafas melalui spirakel.",G('<ellipse cx="24" cy="20" rx="10" ry="7" fill="#cfe9f7"/><ellipse cx="40" cy="20" rx="10" ry="7" fill="#cfe9f7"/><ellipse cx="32" cy="38" rx="20" ry="15" fill="#f7c531"/><path d="M24 26v24M34 24v28M44 27v22M12 38l-6 2" fill="none" stroke-width="5"/>'+ey(47,34))],
["ikan","Ikan","i","Ikan menyerap oksigen dalam air melalui insang.",G('<path d="M44 32l16-12v24zM24 19l8-8 6 9" fill="#2f8fd8"/><ellipse cx="28" cy="32" rx="22" ry="14" fill="#4fb0e8"/><path d="M26 22q-5 10 0 20" fill="none"/>'+ey(15,28))],
["udang","Udang","i","Udang bernafas menggunakan insang.",G('<path d="M46 14q14 10 6 26-8 14-26 12-14-2-14-14 8 6 18 4 10-2 8-16-2-6 8-12z" fill="#f4845f"/><path d="M46 14l12-4" fill="none"/>'+ey(44,22))],
["sotong","Sotong","i","Sotong bernafas di dalam air menggunakan insang.",G('<path d="M16 30q-4 14 2 24M24 30q-2 14 2 26M32 30v26M40 30q2 14-2 26M48 30q4 14-2 24" fill="none" stroke="#d97aa6" stroke-width="5"/><path d="M32 4q22 4 18 26H14Q10 8 32 4z" fill="#d97aa6"/>'+ey(24,22)+ey(40,22))],
["burung","Burung","p","Burung bernafas menggunakan peparu.",G('<path d="M10 44l-8 8 14-2M26 54v8M36 54v8" fill="none"/><circle cx="30" cy="36" r="20" fill="#3b9ae1"/><path d="M48 32l12 4-12 4z" fill="#f5a623"/><path d="M14 36q10-10 20 4-8 8-20-4z" fill="#2b7bb9"/>'+ey(40,30))],
["ular","Ular","p","Ular ialah reptilia dan bernafas dengan peparu.",G('<path d="M10 52q-6-10 8-14t22-8q14-6 8-18" fill="none" stroke-width="13"/><path d="M10 52q-6-10 8-14t22-8q14-6 8-18" fill="none" stroke="#6fbf4a" stroke-width="9"/>'+ey(50,13)+'<path d="M53 8l7-4" fill="none"/>')],
["singa","Singa","p","Singa ialah mamalia dan bernafas dengan peparu.",G('<circle cx="32" cy="34" r="26" fill="#c2701f"/><circle cx="32" cy="36" r="16" fill="#f5b85a"/>'+ey(25,32)+ey(39,32)+'<path d="M29 40h6l-3 4z" fill="#8a4b2a"/><path d="M32 44q-4 5-8 2M32 44q4 5 8 2" fill="none"/>')],
["paus","Ikan paus","p","Paus hidup di laut tetapi ialah mamalia. Ia bernafas dengan peparu.",G('<path d="M54 36l8-14-2 24z" fill="#4a7fc1"/><ellipse cx="30" cy="40" rx="26" ry="16" fill="#4a7fc1"/><path d="M8 44q22 14 44 0-8 10-22 10T8 44z" fill="#cfe3f5"/><path d="M22 24v-8M22 16l-5-4M22 16l5-4" fill="none" stroke="#6ab7e8"/>'+ey(14,36))],
["lipas","Lipas","s","Lipas bernafas melalui spirakel di tepi badannya.",G('<path d="M28 10q-10-6-18 0M36 10q10-6 18 0M18 30l-10-4M18 40l-12 2M18 50l-8 8M46 30l10-4M46 40l12 2M46 50l8 8" fill="none"/><ellipse cx="32" cy="38" rx="14" ry="20" fill="#8a5a3a"/><circle cx="32" cy="16" r="8" fill="#6d4328"/>'+ey(28,15)+ey(36,15)+'<path d="M32 24v28" fill="none"/>')],
["kerang","Kerang","i","Kerang menggunakan insang untuk bernafas dalam air.",G('<path d="M6 48q0-34 26-36 26 2 26 36z" fill="#f2b6a0"/><path d="M32 14v34M20 18l4 30M44 18l-4 30M12 28l10 20M52 28l-10 20" fill="none"/><rect x="26" y="48" width="12" height="6" rx="2" fill="#d98e73"/>')]
].map(a=>({id:a[0],n:a[1],o:a[2],d:a[3],v:a[4]}));
const BASE=["ketam","beluncas","berudu","cacing","lintah","kucing","kupu","buaya"];
let S={on:BASE.slice(),cu:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("kn")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("kn",JSON.stringify(S))}catch(e){}};
const all=()=>D.concat(S.cu);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb=a=>a.img?'<img src="'+a.img+'" alt="">':a.v||G('<circle cx="32" cy="32" r="24" fill="#d9c9a8"/><text x="32" y="42" text-anchor="middle" font-size="28" fill="#3b2a20" stroke="none">'+esc(a.n[0]||"?")+'</text>');
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let cards=[],need={},act=null,doneO=new Set(),found=[],lock=true,sec=0,tick=null,miss=0,tmo=null;
const msg=t=>$("msg").textContent=t;
function newGame(){
 clearInterval(tick);clearTimeout(tmo);tick=null;sec=0;miss=0;act=null;found=[];doneO=new Set();need={};
 $("tm").textContent="0:00";
 const pool=all().filter(a=>S.on.includes(a.id));
 pool.forEach(a=>need[a.o]=(need[a.o]||0)+1);
 if(pool.length<2){cards=[];lock=true;draw();msg("Pilih sekurang-kurangnya 2 haiwan. Tekan ikon tetapan di kanan atas.");return}
 cards=sh(pool).map(a=>({a,open:true,done:false}));lock=true;draw();
 msg("Hafal kedudukan haiwan. Kad akan tertutup sekejap lagi.");
 tmo=setTimeout(()=>{cards.forEach(c=>c.open=false);lock=false;draw();msg("Pilih satu organ di atas, kemudian cari haiwan yang bernafas dengannya.");tick=setInterval(()=>{sec++;$("tm").textContent=fmt(sec)},1000)},2200+cards.length*200);
}
function draw(){
 const n=cards.filter(c=>c.done).length+found.length;
 $("cn").textContent=n+"/"+cards.length;
 $("orgs").innerHTML=Object.keys(ORG).filter(k=>need[k]).map(k=>'<button class="og'+(act===k?' act':'')+(doneO.has(k)?' gone':'')+'" data-o="'+k+'">'+ORG[k].v+'<span>'+ORG[k].n+'</span><small>'+need[k]+' haiwan</small></button>').join("");
 $("grid").innerHTML=cards.map((c,i)=>'<button class="cd'+(c.open||c.done?' op':'')+(c.done?' dn':'')+'" data-i="'+i+'"><div class="in"><div class="bk"></div><div class="fr">'+thumb(c.a)+'<i>'+esc(c.a.n)+'</i></div></div></button>').join("");
}
$("orgs").onclick=e=>{const b=e.target.closest("[data-o]");if(!b||lock)return;const k=b.dataset.o;if(doneO.has(k))return;
 if(found.length&&act!==k){msg("Habiskan "+ORG[act].n+" dahulu, atau buat satu kesilapan untuk mula semula.");return}
 act=k;draw();msg("Cari semua haiwan yang bernafas guna "+ORG[k].n.toLowerCase()+" ("+need[k]+" haiwan).")};
$("grid").onclick=e=>{const b=e.target.closest("[data-i]");if(!b||lock)return;const c=cards[+b.dataset.i];if(c.open||c.done)return;
 if(!act){msg("Pilih organ dahulu.");return}
 c.open=true;
 if(c.a.o===act){found.push(c);msg("Betul. "+c.a.d);
  if(found.length===need[act]){found.forEach(x=>x.done=true);doneO.add(act);found=[];act=null;draw();if(doneO.size===Object.keys(need).length){finish();return}}
  draw()}
 else{miss++;lock=true;draw();msg("Salah. "+c.a.n+" tidak bernafas guna "+ORG[act].n.toLowerCase()+". Semua kad ditutup semula, cari dari awal.");
  setTimeout(()=>{c.open=false;found.forEach(x=>x.open=false);found=[];lock=false;draw()},1200)}};
function finish(){
 clearInterval(tick);tick=null;
 $("bx").innerHTML='<h2>Tahniah, semua padanan betul</h2><p>Masa '+fmt(sec)+'. Kesilapan '+miss+' kali.</p><h3>Apa yang dipelajari</h3><ul>'+cards.slice().sort((a,b)=>a.a.o<b.a.o?-1:1).map(c=>'<li><b>'+esc(c.a.n)+'</b> ('+ORG[c.a.o].n+'): '+esc(c.a.d)+'</li>').join("")+'</ul><button class="btn" id="a1">Main lagi</button> <button class="btn alt" id="a2">Pilih haiwan</button>';
 $("md").classList.add("open");
 $("a1").onclick=()=>{$("md").classList.remove("open");newGame()};
 $("a2").onclick=()=>{$("md").classList.remove("open");openDr()};
}
function openDr(){
 const d=$("dr");
 d.innerHTML='<button class="btn alt" id="x1">Tutup dan mula</button><h3>Pilih haiwan ('+S.on.length+'/50)</h3><div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn alt" id="x2">Pilih semua</button><button class="btn alt" id="x3">Kosongkan</button></div>'+
 all().map(a=>'<label class="row"><input type="checkbox" data-id="'+a.id+'" '+(S.on.includes(a.id)?'checked':'')+' style="width:auto;margin:0">'+thumb(a)+'<span>'+esc(a.n)+' <small>'+ORG[a.o].n+'</small></span>'+(a.id[0]==="c"&&/^c\d/.test(a.id)?'<button class="btn alt" data-del="'+a.id+'" type="button">Buang</button>':'')+'</label>').join("")+
 '<h3>Tambah haiwan sendiri</h3><input id="n1" placeholder="Nama haiwan"><select id="n2">'+Object.keys(ORG).map(k=>'<option value="'+k+'">'+ORG[k].n+'</option>').join("")+'</select><input id="n3" placeholder="Fakta ringkas (pilihan)"><input id="n4" type="file" accept="image/*"><button class="btn" id="n5">Tambah</button><p style="font-size:.78rem;opacity:.75">Tanpa gambar, kad guna huruf pertama nama haiwan.</p>';
 d.classList.add("open");
 $("x1").onclick=()=>{d.classList.remove("open");newGame()};
 $("x2").onclick=()=>{S.on=all().slice(0,50).map(a=>a.id);save();openDr()};
 $("x3").onclick=()=>{S.on=[];save();openDr()};
 d.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{const id=c.dataset.id;
  if(c.checked){if(S.on.length>=50){c.checked=false;return}S.on.push(id)}else S.on=S.on.filter(x=>x!==id);save();d.querySelector("h3").textContent="Pilih haiwan ("+S.on.length+"/50)"});
 d.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.preventDefault();const id=b.dataset.del;S.cu=S.cu.filter(a=>a.id!==id);S.on=S.on.filter(x=>x!==id);save();openDr()});
